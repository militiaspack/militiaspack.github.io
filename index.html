<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GBA Meta Web App</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
    color: #00ff66;
  }

  #wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
  }

  #overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 12px;
    opacity: 0.6;
  }
</style>
</head>

<body>

<div id="overlay">Loading GBA...</div>
<div id="wrap">
  <canvas id="screen"></canvas>
</div>

<!-- GBA.js emulator -->
<script src="https://cdn.jsdelivr.net/npm/gba.js/dist/gba.min.js"></script>

<script>

const overlay = document.getElementById("overlay");
const canvas = document.getElementById("screen");

// ===============================
// INIT EMULATOR
// ===============================

const gba = new GameBoyAdvance();

gba.setCanvas(canvas);

// Load BIOS (required)
gba.loadBIOS("./gba_bios.bin");

// Load ROM
gba.loadRom("./pokemon.gba", () => {
  overlay.textContent = "READY - waiting for input";
});

// ===============================
// INPUT STATE
// ===============================

const input = {
  A: 0,
  B: 0,
  UP: 0,
  DOWN: 0,
  LEFT: 0,
  RIGHT: 0,
  START: 0
};

function update() {
  gba.keypad.set(input);
}

// ===============================
// PRESS HELPERS
// ===============================

function press(key, time = 120) {
  input[key] = 1;
  update();

  setTimeout(() => {
    input[key] = 0;
    update();
  }, time);
}

// ===============================
// META INPUT LAYER
// ===============================

function handleGesture(e) {

  const { type, direction } = e;

  switch (type) {

    case "tap":
      press("A");
      break;

    case "doubleTap":
      press("B");
      break;

    case "hold":
      press("START");
      break;

    case "swipe":

      if (direction === "left") press("LEFT");
      if (direction === "right") press("RIGHT");
      if (direction === "up") press("UP");
      if (direction === "down") press("DOWN");

      break;
  }
}

// ===============================
// META WEB APP EVENT HOOK
// ===============================

window.addEventListener("metaGesture", (e) => {
  handleGesture(e.detail);
});

// ===============================
// FALLBACK TEST INPUTS
// ===============================

window.addEventListener("keydown", (e) => {

  if (e.key === "ArrowUp") handleGesture({type:"swipe",direction:"up"});
  if (e.key === "ArrowDown") handleGesture({type:"swipe",direction:"down"});
  if (e.key === "ArrowLeft") handleGesture({type:"swipe",direction:"left"});
  if (e.key === "ArrowRight") handleGesture({type:"swipe",direction:"right"});

  if (e.key === "Enter") handleGesture({type:"tap"});
  if (e.key === " ") handleGesture({type:"doubleTap"});
  if (e.key === "Shift") handleGesture({type:"hold"});
});

</script>

</body>
</html>
