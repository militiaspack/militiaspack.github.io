<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAYBAN • POKÉMON</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0; padding: 0; background: #000; color: #0f0; font-family: 'Press Start 2P', sans-serif;
      overflow: hidden; height: 100vh; display: flex; flex-direction: column;
    }

    header {
      background: rgba(0, 255, 0, 0.1); padding: 15px; text-align: center; border-bottom: 2px solid #0f0;
    }

    #game-container {
      flex: 1; position: relative; background: #000;
    }

    #emulator {
      width: 100%; height: 100%; border: none;
    }

    .controls {
      position: fixed; bottom: 0; left: 0; right: 0; height: 180px; pointer-events: none; z-index: 10;
    }

    .dpad {
      position: absolute; left: 25px; bottom: 30px; width: 130px; height: 130px;
      background: rgba(0,255,0,0.15); border: 4px solid #0f0; border-radius: 25px;
      pointer-events: all;
    }

    .ab-buttons {
      position: absolute; right: 35px; bottom: 50px; pointer-events: all;
    }

    .btn {
      width: 70px; height: 70px; border-radius: 50%; border: 4px solid #0f0; background: rgba(0,255,0,0.15);
      display: flex; align-items: center; justify-content: center; margin: 8px; color: #0f0; font-size: 24px;
      box-shadow: 0 0 12px #0f0;
    }

    button {
      margin: 20px auto; display: block; padding: 12px 24px; background: #111; color: #0f0;
      border: 2px solid #0f0; font-family: 'Press Start 2P', sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>

  <header><h1>RAYBAN META • POKÉMON</h1></header>

  <div id="game-container">
    <div id="start-screen">
      <button onclick="loadPokemon()">LOAD POKÉMON</button>
    </div>
    <div id="emulator" style="display:none;"></div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad"></div>
    <div class="ab-buttons">
      <div class="btn" id="btnA">A</div>
      <div class="btn" id="btnB">B</div>
    </div>
  </div>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  <script>
    let EJS_player = "#emulator";
    let EJS_core = "gba";
    let EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    async function loadPokemon() {
      try {
        // Try to load pokemon.gba from the same folder
        const response = await fetch('pokemon.gba');
        if (!response.ok) throw new Error("File not found");

        const romBlob = await response.blob();
        const romArrayBuffer = await romBlob.arrayBuffer();

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('emulator').style.display = 'block';

        // Start EmulatorJS with local ROM
        EJS_gameName = "Pokémon";
        EJS_gameUrl = URL.createObjectURL(new Blob([romArrayBuffer]));

        // Initialize
        new EJS(EJS_player, {
          core: EJS_core,
          gameUrl: EJS_gameUrl,
          gameName: EJS_gameName,
          pathtodata: EJS_pathtodata,
          width: "100%",
          height: "100%"
        });

      } catch (e) {
        alert("Could not load pokemon.gba\n\nMake sure the file is named exactly 'pokemon.gba' and uploaded to the same folder as index.html");
        console.error(e);
      }
    }

    // Basic touch controls (EmulatorJS also supports on-screen controls)
    let lastTap = 0;
    let holdTimer;

    document.getElementById('btnA').addEventListener('touchstart', () => {
      // EmulatorJS usually maps Z = A
      window.dispatchEvent(new KeyboardEvent('keydown', {key: 'z'}));
    });

    document.getElementById('btnB').addEventListener('touchstart', () => {
      window.dispatchEvent(new KeyboardEvent('keydown', {key: 'x'}));
    });

    // Double tap = B
    document.addEventListener('touchend', () => {
      const now = Date.now();
      if (now - lastTap < 350) {
        window.dispatchEvent(new KeyboardEvent('keydown', {key: 'x'}));
      }
      lastTap = now;
    });

    // Long press = Start
    document.addEventListener('touchstart', () => {
      holdTimer = setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keydown', {key: 'Enter'}));
      }, 600);
    });

    document.addEventListener('touchend', () => clearTimeout(holdTimer));
  </script>
</body>
</html>
