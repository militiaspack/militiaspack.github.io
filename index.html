<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GBA on Ray-Ban</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #0f0;
      font-family: 'Press Start 2P', system-ui;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #container {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 6px;
      text-shadow: 0 0 10px #0f0;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 11px;
      color: #555;
      margin-bottom: 15px;
    }

    #game {
      border: 6px solid #222;
      border-radius: 4px;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.25);

      width: 100%;
      max-width: 480px;
      height: 320px;

      image-rendering: pixelated;
    }

    #status {
      font-size: 13px;
      margin: 15px 0;
      min-height: 22px;
    }
  </style>
</head>

<body>

  <div id="container">

    <h1>GBA ON RAY-BAN</h1>

    <p class="subtitle">
      RETRO GAMING • 2026
    </p>

    <div id="game"></div>

    <div id="status">
      Loading Pokémon...
    </div>

  </div>

  <script>
    // =====================================
    // EmulatorJS CONFIG
    // =====================================

    EJS_player = '#game';

    EJS_core = 'gba';

    EJS_pathtodata =
      'https://cdn.emulatorjs.org/stable/data/';

    // AUTO LOAD ROM
    EJS_gameUrl = './pokemon.gba';

    // Optional BIOS
    // EJS_biosUrl = './gba_bios.bin';

    // Optional save support
    EJS_startOnLoaded = true;

    // Disable on-screen controls
    EJS_disableDatabases = true;

    // Hide unnecessary UI
    EJS_hideSettings = true;

    // =====================================
    // Status Handling
    // =====================================

    window.addEventListener('load', () => {

      const status =
        document.getElementById('status');

      status.textContent =
        'Starting Pokémon...';

    });
  </script>

  <!-- EmulatorJS Loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
