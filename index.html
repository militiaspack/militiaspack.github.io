<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAYBAN • GBA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0; padding: 0; background: #000; color: #0f0; font-family: 'Press Start 2P', sans-serif;
      overflow: hidden; height: 100vh; display: flex; flex-direction: column;
    }

    header {
      background: rgba(0, 255, 0, 0.1); padding: 12px; text-align: center; border-bottom: 2px solid #0f0;
      text-shadow: 0 0 10px #0f0;
    }

    .library {
      flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;
    }

    .game {
      background: #111; border: 2px solid #0f0; padding: 12px; text-align: center; cursor: pointer;
      transition: all 0.2s; font-size: 13px; border-radius: 4px;
    }

    .game:hover { background: #020; transform: scale(1.05); box-shadow: 0 0 15px #0f0; }

    #emulator-frame {
      flex: 1; border: none; background: #000; width: 100%; height: 100%;
    }

    .controls {
      position: fixed; bottom: 0; left: 0; right: 0; height: 190px; pointer-events: none; z-index: 10;
    }

    .dpad {
      position: absolute; left: 25px; bottom: 35px; width: 130px; height: 130px;
      background: rgba(0,255,0,0.12); border: 4px solid #0f0; border-radius: 25px;
      pointer-events: all;
    }

    .ab-buttons {
      position: absolute; right: 35px; bottom: 55px;
      pointer-events: all;
    }

    .btn {
      width: 68px; height: 68px; border-radius: 50%; border: 4px solid #0f0; background: rgba(0,255,0,0.12);
      display: inline-flex; align-items: center; justify-content: center; margin: 8px; color: #0f0; font-size: 20px;
      box-shadow: 0 0 10px #0f0;
    }

    .overlay {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 10px 14px; border: 1px solid #0f0;
      font-size: 12px; line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>RAYBAN META • GBA</h1>
  </header>

  <div id="library" class="library"></div>

  <iframe id="emulator-frame" style="display:none;" allowfullscreen></iframe>

  <div class="controls">
    <div class="dpad" id="dpad"></div>
    
    <div class="ab-buttons">
      <div class="btn" id="btnA">A</div>
      <div class="btn" id="btnB">B</div>
    </div>

    <div class="overlay">
      Swipe = D-Pad<br>
      Tap = A | Double Tap = B<br>
      Hold = START
    </div>
  </div>

  <script>
    const games = [
      {name: "Pokémon Emerald", id: "pokemonemerald"},
      {name: "Pokémon FireRed", id: "pokemonred"},
      {name: "Advance Wars", id: "advancewars"},
      {name: "Advance Wars 2", id: "advancewars2"},
      {name: "The Minish Cap", id: "zelda_minish"},
      {name: "Mario & Luigi Superstar Saga", id: "superstar"},
      {name: "Metroid Fusion", id: "metroid_fusion"},
      {name: "Kirby & The Amazing Mirror", id: "kirbymirror"},
      {name: "Golden Sun", id: "goldensun"},
      {name: "Mario Kart Super Circuit", id: "mariokart"},
      // Add more as you like
    ];

    const library = document.getElementById('library');
    const frame = document.getElementById('emulator-frame');

    games.forEach(game => {
      const el = document.createElement('div');
      el.className = 'game';
      el.textContent = game.name;
      el.onclick = () => loadGame(game.id);
      library.appendChild(el);
    });

    function loadGame(id) {
      library.style.display = 'none';
      frame.style.display = 'block';
      frame.src = `https://gba.js.org/player#${id}`;
    }

    // Touch Controls
    let lastTap = 0;
    let holdTimer;

    const dpad = document.getElementById('dpad');

    dpad.addEventListener('touchstart', e => {
      e.preventDefault();
    });

    dpad.addEventListener('touchmove', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const dx = touch.clientX - dpad.getBoundingClientRect().left - 65;
      const dy = touch.clientY - dpad.getBoundingClientRect().top - 65;

      const iframeWin = frame.contentWindow;
      if (!iframeWin) return;

      if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
        if (Math.abs(dx) > Math.abs(dy)) {
          iframeWin.postMessage({key: dx > 0 ? 'ArrowRight' : 'ArrowLeft'}, '*');
        } else {
          iframeWin.postMessage({key: dy > 0 ? 'ArrowDown' : 'ArrowUp'}, '*');
        }
      }
    });

    document.getElementById('btnA').addEventListener('touchstart', () => {
      frame.contentWindow?.postMessage({key: 'KeyZ'}, '*');
    });

    document.getElementById('btnB').addEventListener('touchstart', () => {
      frame.contentWindow?.postMessage({key: 'KeyX'}, '*');
    });

    // Double tap anywhere on screen = B
    document.addEventListener('touchend', () => {
      if (frame.style.display === 'none') return;
      const now = Date.now();
      if (now - lastTap < 350) {
        frame.contentWindow?.postMessage({key: 'KeyX'}, '*');
      }
      lastTap = now;
    });

    // Long press = Start
    document.addEventListener('touchstart', e => {
      if (frame.style.display === 'block') {
        holdTimer = setTimeout(() => {
          frame.contentWindow?.postMessage({key: 'Enter'}, '*');
        }, 650);
      }
    });

    document.addEventListener('touchend', () => clearTimeout(holdTimer));
  </script>
</body>
</html>
