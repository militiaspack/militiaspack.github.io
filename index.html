<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>Pokémon on Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:#000; overflow:hidden; color:#0f0; font-family:monospace; }
    canvas { image-rendering: pixelated; width:100%; height:100vh; display:block; }
    #status { position:absolute; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.8); padding:12px; border-radius:8px; max-width:80%; }
  </style>
</head>
<body>
  <div id="status">Initializing emulator...</div>
  <canvas id="screen" width="240" height="160"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/andychase/gbajs2@master/js/gba.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    let gba = null;   // ← Global now

    function updateStatus(msg, color = '#0f0') {
      statusEl.textContent = msg;
      statusEl.style.color = color;
    }

    async function startEmulator() {
      try {
        updateStatus("Creating emulator...");
        gba = new GameBoyAdvance();
        gba.setCanvas(canvas);

        updateStatus("Fetching pokemon.gba...");
        const response = await fetch('pokemon.gba', { cache: 'no-cache' });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        
        updateStatus("Loading ROM...");
        gba.loadROMArrayBuffer(arrayBuffer);
        
        updateStatus("Starting Pokémon...", "#ff0");
        gba.run();

        setTimeout(() => { statusEl.style.display = 'none'; }, 2000);

      } catch (err) {
        console.error(err);
        updateStatus("ERROR loading pokemon.gba\n\n" + 
          "• File must be named exactly 'pokemon.gba' (lowercase)\n" +
          "• Must be in the same folder as index.html\n" +
          "• Try hard refresh or different host", "#f66");
      }
    }

    function setupControls() {
      const keyMap = {
        ArrowUp: 0, ArrowDown: 1, ArrowLeft: 2, ArrowRight: 3,   // Swipes = D-pad
        'z': 4, ' ': 4, 'Enter': 4,                             // Tap = A
        'x': 5,                                                 // Double tap simulation = B
        's': 6                                                  // Tap & hold simulation = Start
      };

      document.addEventListener('keydown', e => {
        if (gba && keyMap[e.key] !== undefined) {
          gba.keyPress(keyMap[e.key]);
        }
      });

      document.addEventListener('keyup', e => {
        if (gba && keyMap[e.key] !== undefined) {
          gba.keyRelease(keyMap[e.key]);
        }
      });
    }

    // Start everything
    window.onload = () => {
      setupControls();
      startEmulator();
    };
  </script>
</body>
</html>
