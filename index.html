<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>Pokémon on Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:#000; overflow:hidden; color:#0f0; font-family:monospace; }
    canvas { image-rendering: pixelated; width:100%; height:100vh; display:block; }
    #status { position:absolute; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.85); padding:15px; border-radius:8px; white-space:pre-wrap; max-width:85%; }
  </style>
</head>
<body>
  <div id="status">Loading emulator core...</div>
  <canvas id="screen" width="240" height="160"></canvas>

  <!-- Using a more complete hosted version -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/IodineGBA@master/js/IodineGBA.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    let emulator = null;

    function updateStatus(msg, color = '#0f0') {
      statusEl.textContent = msg;
      statusEl.style.color = color;
    }

    async function startEmulator() {
      try {
        updateStatus("Initializing IodineGBA...");

        // Create emulator instance
        emulator = new IodineGBA();

        // Set up canvas
        emulator.attachCanvas(canvas);

        updateStatus("Fetching pokemon.gba...");
        const response = await fetch('pokemon.gba', { cache: 'no-cache' });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const romBuffer = await response.arrayBuffer();

        updateStatus("Loading ROM...");
        emulator.loadROM(romBuffer);

        updateStatus("Starting game...", "#ff0");
        emulator.run();

        setTimeout(() => { statusEl.style.display = 'none'; }, 2500);

      } catch (err) {
        console.error(err);
        updateStatus("ERROR: " + err.message + "\n\n" +
          "• Make sure pokemon.gba is in the same folder\n" +
          "• Exact filename (lowercase)\n" +
          "• Try Vercel/Netlify host", "#f66");
      }
    }

    function setupControls() {
      const keyMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        'z': 'a', ' ': 'a',          // Tap = A
        'x': 'b',                    // Double tap simulation = B
        's': 'start',                // Hold simulation = Start
        'Shift': 'select'
      };

      document.addEventListener('keydown', e => {
        if (emulator && keyMap[e.key]) {
          emulator.keyPress(keyMap[e.key]);
        }
      });

      document.addEventListener('keyup', e => {
        if (emulator && keyMap[e.key]) {
          emulator.keyRelease(keyMap[e.key]);
        }
      });
    }

    window.onload = () => {
      setupControls();
      startEmulator();
    };
  </script>
</body>
</html>
