<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>Pokémon on Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:#000; overflow:hidden; color:#0f0; font-family:monospace; }
    canvas { image-rendering: pixelated; width:100%; height:100vh; display:block; }
    #status { position:absolute; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.85); padding:15px; border-radius:8px; white-space:pre-wrap; max-width:85%; }
  </style>
</head>
<body>
  <div id="status">Loading emulator core...</div>
  <canvas id="screen" width="240" height="160"></canvas>

  <!-- Load gbajs core files in correct order -->
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvance.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvanceIO.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvanceMemory.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvanceCPU.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvanceGraphics.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/endrift/gbajs/js/GameBoyAdvanceSound.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    let gba = null;

    function updateStatus(msg, color = '#0f0') {
      statusEl.textContent = msg;
      statusEl.style.color = color;
    }

    async function startEmulator() {
      try {
        updateStatus("Creating GameBoyAdvance emulator...");
        
        gba = new GameBoyAdvance();
        gba.setCanvas(canvas);

        updateStatus("Fetching pokemon.gba...");
        const response = await fetch('pokemon.gba', { cache: 'no-cache' });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - Check file name and upload`);
        }

        const romBuffer = await response.arrayBuffer();

        updateStatus("Loading ROM...");
        gba.loadROM(romBuffer);

        updateStatus("Starting Pokémon...", "#ff0");
        gba.run();

        setTimeout(() => statusEl.style.display = 'none', 2500);

      } catch (err) {
        console.error(err);
        updateStatus("ERROR: " + err.message + "\n\nMake sure:\n• pokemon.gba is in same folder\n• Exact lowercase name\n• Hosted properly (Vercel/Netlify best)", "#f66");
      }
    }

    function setupControls() {
      const keyMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        'z': 'a', ' ': 'a',          // Tap → A
        'x': 'b',                    // Double tap → B
        's': 'start',                // Hold → Start
        'Shift': 'select'
      };

      document.addEventListener('keydown', e => {
        if (gba && keyMap[e.key]) gba.keyPress(keyMap[e.key]);
      });

      document.addEventListener('keyup', e => {
        if (gba && keyMap[e.key]) gba.keyRelease(keyMap[e.key]);
      });
    }

    window.onload = () => {
      setupControls();
      startEmulator();
    };
  </script>
</body>
</html>
