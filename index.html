<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Pokemon on Ray-Ban</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100vw;
      height: 100vh;

      font-family: 'Press Start 2P', monospace;
      color: #00ff66;
    }

    #container {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      text-shadow: 0 0 10px #00ff66;
    }

    #status {
      font-size: 10px;
      color: #888;
      margin-bottom: 12px;
    }

    #game {
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      background: black;
    }

  </style>
</head>

<body>

  <div id="container">

    <h1>POKEMON GBA</h1>

    <div id="status">
      Loading Pokémon...
    </div>

    <div id="game"></div>

  </div>

  <script>

    // =========================================
    // EMULATORJS CONFIG
    // =========================================

    EJS_player = "#game";

    EJS_core = "gba";

    EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    // ROM beside index.html
    EJS_gameUrl = "./pokemon.gba";

    // Optional BIOS
    // EJS_biosUrl = "./gba_bios.bin";

    EJS_startOnLoaded = true;

    // Cleaner UI
    EJS_disableDatabases = true;
    EJS_hideSettings = true;
    EJS_Buttons = {
      playPause: false,
      restart: false,
      mute: false,
      settings: false,
      fullscreen: false,
      saveState: false,
      loadState: false,
      screenRecord: false,
      gamepad: false,
      cheats: false
    };

    // =========================================
    // STATUS
    // =========================================

    window.addEventListener('load', () => {

      const status =
        document.getElementById('status');

      status.textContent =
        'Starting Pokémon...';

    });

  </script>

  <!-- EmulatorJS -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <script>

    // =========================================
    // WAIT FOR EMULATOR
    // =========================================

    function waitForEmulator() {

      if (!window.EJS_emulator ||
          !EJS_emulator.gameManager) {

        setTimeout(waitForEmulator, 500);
        return;
      }

      console.log("Emulator Ready");

      setupControls();
    }

    waitForEmulator();

    // =========================================
    // CONTROL SYSTEM
    // =========================================

    function tapKey(key) {

      try {

        EJS_emulator
          .gameManager
          .controls
          .pressKey(key);

        setTimeout(() => {

          EJS_emulator
            .gameManager
            .controls
            .releaseKey(key);

        }, 80);

      } catch (err) {

        console.error(err);

      }
    }

    function setupControls() {

      const game =
        document.getElementById('game');

      let touchStartX = 0;
      let touchStartY = 0;

      let lastTap = 0;

      let holdTimer;

      // =====================================
      // TOUCH START
      // =====================================

      game.addEventListener(
        'touchstart',
        (e) => {

          const touch = e.touches[0];

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;

          // HOLD = START
          holdTimer = setTimeout(() => {

            tapKey('START');

          }, 500);

        },
        { passive: true }
      );

      // =====================================
      // TOUCH END
      // =====================================

      game.addEventListener(
        'touchend',
        (e) => {

          clearTimeout(holdTimer);

          const touch =
            e.changedTouches[0];

          const deltaX =
            touch.clientX - touchStartX;

          const deltaY =
            touch.clientY - touchStartY;

          const absX =
            Math.abs(deltaX);

          const absY =
            Math.abs(deltaY);

          const now = Date.now();

          // =================================
          // DOUBLE TAP = B
          // =================================

          if (now - lastTap < 300) {

            tapKey('B');

            lastTap = 0;
            return;
          }

          lastTap = now;

          // =================================
          // TAP = A
          // =================================

          if (absX < 20 && absY < 20) {

            tapKey('A');
            return;
          }

          // =================================
          // SWIPE HORIZONTAL
          // =================================

          if (absX > absY) {

            if (deltaX > 0) {

              tapKey('RIGHT');

            } else {

              tapKey('LEFT');

            }

            return;
          }

          // =================================
          // SWIPE VERTICAL
          // =================================

          if (deltaY > 0) {

            tapKey('DOWN');

          } else {

            tapKey('UP');

          }

        },
        { passive: true }
      );

      // =====================================
      // KEYBOARD TESTING
      // =====================================

      document.addEventListener(
        'keydown',
        (e) => {

          if (e.key === 'ArrowUp')
            tapKey('UP');

          if (e.key === 'ArrowDown')
            tapKey('DOWN');

          if (e.key === 'ArrowLeft')
            tapKey('LEFT');

          if (e.key === 'ArrowRight')
            tapKey('RIGHT');

          if (e.key === 'z')
            tapKey('A');

          if (e.key === 'x')
            tapKey('B');

          if (e.key === 'Enter')
            tapKey('START');

        }
      );

    }

  </script>

</body>
</html>
