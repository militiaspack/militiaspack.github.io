<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA on Ray-Ban</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: system-ui;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 70%;
      border: 2px solid #555;
    }
    #status {
      margin-top: 20px;
      font-size: 15px;
      text-align: center;
    }
    input { margin-top: 15px; }
  </style>
</head>
<body>
  <div id="container">
    <h2>GBA Emulator</h2>
    <canvas id="screen" width="240" height="160"></canvas>
    <div id="status">Loading ROM...</div>
    <input type="file" id="romInput" accept=".gba" style="margin-top: 15px;">
  </div>

  <script src="https://cdn.jsdelivr.net/gh/andychase/gbajs2@master/js/gbajs2.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');
    const romInput = document.getElementById('romInput');

    let emulator = new GameBoyAdvance();
    emulator.setCanvas(canvas);

    const romFileName = "pokemon.gba";   // ← Change to your exact filename

    async function loadROMFromURL() {
      try {
        status.textContent = `Trying to load ${romFileName}...`;
        
        const response = await fetch(romFileName, { cache: 'no-store' });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - File not found`);
        }

        const arrayBuffer = await response.arrayBuffer();
        
        status.textContent = "ROM loaded successfully! Starting emulator...";
        emulator.loadROM(arrayBuffer);
        emulator.run();
        
        setTimeout(() => status.style.display = "none", 2500);
      } catch (err) {
        console.error(err);
        status.innerHTML = `Failed to load ROM.<br><small>${err.message}</small><br><br>Use the file picker below instead.`;
      }
    }

    // Fallback: Manual file upload
    romInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = "Loading selected ROM...";
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          emulator.loadROM(ev.target.result);
          emulator.run();
          status.textContent = "ROM loaded from file!";
          setTimeout(() => status.style.display = "none", 2000);
        } catch (err) {
          status.textContent = "Error starting emulator.";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Try auto-load first
    window.onload = loadROMFromURL;
  </script>
</body>
</html>
