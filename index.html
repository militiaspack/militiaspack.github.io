<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA on Ray-Ban</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #0f0;
      font-family: 'Press Start 2P', system-ui;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      image-rendering: pixelated;
    }

    #container {
      text-align: center;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #0f0;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 11px;
      color: #666;
      margin-bottom: 20px;
    }

    canvas {
      image-rendering: pixelated;
      border: 6px solid #333;
      border-radius: 4px;
      background: #000;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
      max-width: 96%;
    }

    #controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #status {
      font-size: 13px;
      margin: 10px 0;
      min-height: 20px;
    }

    input[type="file"] {
      background: #111;
      color: #0f0;
      border: 2px solid #333;
      padding: 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .btn {
      background: #111;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      margin: 0 5px;
    }

    .btn:hover {
      background: #0f0;
      color: #000;
    }

    .scanlines {
      position: relative;
    }

    .scanlines::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        rgba(0, 255, 0, 0.07) 2px,
        rgba(0, 255, 0, 0.07) 4px
      );
      pointer-events: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>GBA ON RAY-BAN</h1>
    <p class="subtitle">RETRO GAMING • 2026</p>

    <div class="scanlines">
      <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <div id="status">Emulator Ready • Load a .gba ROM</div>

    <div id="controls">
      <input type="file" id="romInput" accept=".gba">
      
      <div>
        <button class="btn" id="pauseBtn">PAUSE</button>
        <button class="btn" id="resetBtn">RESET</button>
      </div>
    </div>

    <p style="margin-top: 25px; font-size: 10px; color: #444;">
      Tip: Works best on desktop. Touch controls coming soon.
    </p>
  </div>

  <!-- Emulator Script -->
  <script src="gba.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');
    const romInput = document.getElementById('romInput');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    let emulator;
    let isPaused = false;

    // Initialize Emulator
    function initEmulator() {
      try {
        emulator = new GameBoyAdvance();
        emulator.setCanvas(canvas);
        status.textContent = "✅ Emulator Ready - Load ROM";
      } catch (e) {
        status.textContent = "❌ Failed to initialize emulator";
        console.error(e);
      }
    }

    // Load ROM
    romInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = "Loading ROM...";
      
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          emulator.loadROM(ev.target.result);
          emulator.run();
          status.textContent = "🎮 " + file.name + " running";
          isPaused = false;
        } catch (err) {
          status.textContent = "❌ Error loading ROM";
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Pause / Resume
    pauseBtn.addEventListener('click', () => {
      if (!emulator) return;
      isPaused = !isPaused;
      if (isPaused) {
        emulator.pause();
        pauseBtn.textContent = "RESUME";
        status.textContent = "⏸️ Paused";
      } else {
        emulator.run();
        pauseBtn.textContent = "PAUSE";
        status.textContent = "🎮 Game Running";
      }
    });

    // Reset
    resetBtn.addEventListener('click', () => {
      if (!emulator) return;
      emulator.reset();
      status.textContent = "🔄 Reset Complete";
    });

    // Initialize on load
    window.onload = initEmulator;
  </script>
</body>
</html>
