<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>Pokémon GBA - Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; }
    canvas { image-rendering: pixelated; width: 100%; height: 100vh; display: block; }
    #status { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; z-index: 10; }
  </style>
</head>
<body>
  <div id="status">Loading Pokémon...</div>
  <canvas id="screen" width="240" height="160"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/thenick775/gbajs3@master/dist/gbajs3.min.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');

    // Initialize emulator
    const gba = new GBA();
    gba.setCanvas(canvas);

    // Auto-load pokemon.gba from same folder
    async function loadROM() {
      try {
        status.textContent = "Fetching pokemon.gba...";
        const response = await fetch('pokemon.gba');
        
        if (!response.ok) throw new Error('ROM not found');
        
        const arrayBuffer = await response.arrayBuffer();
        
        status.textContent = "Loading ROM...";
        gba.loadROM(arrayBuffer);
        
        status.textContent = "Starting Pokémon...";
        gba.run();
        
        setTimeout(() => status.style.display = 'none', 2000);
      } catch (err) {
        status.textContent = "Error: pokemon.gba not found in same folder";
        console.error(err);
      }
    }

    // Keyboard / Neural Band mapping (Meta glasses translate gestures)
    function setupControls() {
      const keyMap = {
        'ArrowUp': 0,    // D-pad
        'ArrowDown': 1,
        'ArrowLeft': 2,
        'ArrowRight': 3,
        'z': 4,          // A (tap)
        'x': 5,          // B (double tap)
        'Enter': 6,      // Start (tap & hold)
        'Shift': 7       // Select
      };

      document.addEventListener('keydown', e => {
        if (keyMap[e.key] !== undefined) {
          gba.keyPress(keyMap[e.key]);
        }
      });

      document.addEventListener('keyup', e => {
        if (keyMap[e.key] !== undefined) {
          gba.keyRelease(keyMap[e.key]);
        }
      });
    }

    // Start everything
    window.onload = () => {
      setupControls();
      loadROM();
    };
  </script>
</body>
</html>
