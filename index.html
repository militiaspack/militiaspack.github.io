<script src="https://unpkg.com/gba.js/dist/gba.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ===============================
  // SAFE ELEMENT GET
  // ===============================

  let overlay = document.getElementById("overlay");
  const canvas = document.getElementById("screen");

  // Fallback if overlay is missing
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.style.position = "absolute";
    overlay.style.top = "10px";
    overlay.style.left = "10px";
    overlay.style.color = "#00ff66";
    overlay.style.fontFamily = "monospace";
    document.body.appendChild(overlay);
  }

  // ===============================
  // VERIFY LIBRARY
  // ===============================

  if (!window.GameBoyAdvance) {
    overlay.textContent = "ERROR: GBA LIB NOT LOADED";
    console.error("GameBoyAdvance is undefined");
    return;
  }

  // ===============================
  // INIT EMULATOR
  // ===============================

  const gba = new GameBoyAdvance();
  gba.setCanvas(canvas);

  overlay.textContent = "Loading BIOS...";

  fetch("./gba_bios.bin")
    .then(res => res.arrayBuffer())
    .then(bios => {

      gba.loadBIOS(bios);

      overlay.textContent = "Loading ROM...";

      return fetch("./pokemon.gba");

    })
    .then(res => res.arrayBuffer())
    .then(buffer => {

      if (gba.loadROM) {
        gba.loadROM(buffer);
      } else {
        gba.loadRomFromFile(buffer);
      }

      overlay.textContent = "READY";
      gba.runStable();

    })
    .catch(err => {
      overlay.textContent = "LOAD FAILED";
      console.error(err);
    });

  // ===============================
  // INPUT STATE
  // ===============================

  const input = {
    A: 0,
    B: 0,
    UP: 0,
    DOWN: 0,
    LEFT: 0,
    RIGHT: 0,
    START: 0
  };

  function update() {
    if (gba.keypad) gba.keypad.set(input);
  }

  // ===============================
  // PRESS HELPERS
  // ===============================

  function press(key, time = 120) {
    input[key] = 1;
    update();

    setTimeout(() => {
      input[key] = 0;
      update();
    }, time);
  }

  // ===============================
  // META INPUT
  // ===============================

  function handleGesture(e) {
    const { type, direction } = e;

    switch (type) {
      case "tap":
        press("A");
        break;

      case "doubleTap":
        press("B");
        break;

      case "hold":
        press("START");
        break;

      case "swipe":
        if (direction === "left") press("LEFT");
        if (direction === "right") press("RIGHT");
        if (direction === "up") press("UP");
        if (direction === "down") press("DOWN");
        break;
    }
  }

  // ===============================
  // EVENT HOOKS
  // ===============================

  window.addEventListener("metaGesture", (e) => {
    handleGesture(e.detail);
  });

  window.addEventListener("keydown", (e) => {

    if (e.key === "ArrowUp") handleGesture({type:"swipe",direction:"up"});
    if (e.key === "ArrowDown") handleGesture({type:"swipe",direction:"down"});
    if (e.key === "ArrowLeft") handleGesture({type:"swipe",direction:"left"});
    if (e.key === "ArrowRight") handleGesture({type:"swipe",direction:"right"});

    if (e.key === "Enter") handleGesture({type:"tap"});
    if (e.key === " ") handleGesture({type:"doubleTap"});
    if (e.key === "Shift") handleGesture({type:"hold"});
  });

});
</script>
