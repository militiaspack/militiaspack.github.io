<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GBA Meta Web App</title>

<style>
  body {
    margin: 0;
    background: black;
    color: #00ff66;
    font-family: monospace;
    overflow: hidden;
    touch-action: none;
  }

  #screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #display {
    font-size: 20px;
    text-align: center;
    white-space: pre-line;
  }

  #hint {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div id="screen">
  <div id="display">READY</div>
  <div id="hint">Tap / Swipe / Hold</div>
</div>

<script>

const display = document.getElementById("display");

// ===============================
// INPUT LAYER (YOUR GAME API)
// ===============================

function press(button) {
  console.log("INPUT:", button);
  display.textContent = button;
}

// ===============================
// META WEB APP INPUT HOOK
// ===============================
// This is the ONLY part that depends on Meta runtime.

function handleMetaGesture(event) {

  // expected shape:
  // { type: "tap" | "swipe" | "hold", direction?: "left/right/up/down" }

  const { type, direction } = event;

  switch (type) {

    case "tap":
      press("A");
      break;

    case "doubleTap":
      press("B");
      break;

    case "hold":
      press("START");
      break;

    case "swipe":

      if (direction === "left") press("LEFT");
      if (direction === "right") press("RIGHT");
      if (direction === "up") press("UP");
      if (direction === "down") press("DOWN");

      break;
  }
}

// ===============================
// META EVENT LISTENER
// ===============================
// This is what the Meta Web App runtime should trigger

window.addEventListener("metaGesture", (e) => {
  handleMetaGesture(e.detail);
});

// ===============================
// DEBUG MODE (so you can test NOW)
// ===============================
// Remove later if Meta runtime overrides input

window.addEventListener("keydown", (e) => {

  if (e.key === "ArrowUp") handleMetaGesture({type:"swipe",direction:"up"});
  if (e.key === "ArrowDown") handleMetaGesture({type:"swipe",direction:"down"});
  if (e.key === "ArrowLeft") handleMetaGesture({type:"swipe",direction:"left"});
  if (e.key === "ArrowRight") handleMetaGesture({type:"swipe",direction:"right"});

  if (e.key === "Enter") handleMetaGesture({type:"tap"});
  if (e.key === " ") handleMetaGesture({type:"doubleTap"});
  if (e.key === "Shift") handleMetaGesture({type:"hold"});
});

</script>

</body>
</html>
