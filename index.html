<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA on Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:black; color:white; font-family:system-ui; overflow:hidden; touch-action:none; }
    #container { display:flex; flex-direction:column; height:100vh; align-items:center; justify-content:center; gap:15px; }
    canvas { image-rendering:pixelated; border:3px solid #666; background:#000; max-width:95%; max-height:65%; }
    #status { font-size:15px; text-align:center; }
  </style>
</head>
<body>
  <div id="container">
    <h2>GBA Emulator</h2>
    <canvas id="screen" width="240" height="160"></canvas>
    <div id="status">Select your ROM below</div>
    <input type="file" id="romInput" accept=".gba">
  </div>

  <script src="gba.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');
    const romInput = document.getElementById('romInput');

    let emulator;

    try {
      emulator = new GameBoyAdvance();
      emulator.setCanvas(canvas);
      status.textContent = "Emulator ready - select ROM";
    } catch (e) {
      status.textContent = "Emulator failed to initialize";
      console.error(e);
    }

    romInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = "Loading ROM...";
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          emulator.loadROM(ev.target.result);
          emulator.run();
          status.textContent = "✅ Game running!";
        } catch (err) {
          status.textContent = "Error starting game";
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
