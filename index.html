<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA on Ray-Ban</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: system-ui;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 75%;
      border: 1px solid #444;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>GBA Emulator - Ray-Ban</h2>
    <canvas id="screen" width="240" height="160"></canvas>
    <div id="status">Loading ROM...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/andychase/gbajs2@master/js/gbajs2.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');

    let emulator = new GameBoyAdvance();
    emulator.setCanvas(canvas);

    // === CHANGE THIS TO YOUR ROM FILENAME ===
    const romFileName = "yourgame.gba";   // ←←← Put your actual filename here

    // Auto-load ROM from same folder
    async function loadROM() {
      try {
        status.textContent = "Downloading ROM...";
        
        const response = await fetch(romFileName);
        if (!response.ok) throw new Error("ROM not found");

        const arrayBuffer = await response.arrayBuffer();
        
        status.textContent = "ROM loaded! Starting...";
        emulator.loadROM(arrayBuffer);
        emulator.run();
        
        setTimeout(() => status.style.display = "none", 2000);
      } catch (err) {
        status.textContent = "Error loading ROM. Check filename.";
        console.error(err);
      }
    }

    // Touch Controls (Swipe = D-pad, Tap = A, Double Tap = B, Hold = Start)
    let touchStartX = 0, touchStartY = 0;
    let lastTap = 0;
    let holdTimer = null;

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;

      holdTimer = setTimeout(() => {
        emulator.keyDown(9); // Start
      }, 450);
    });

    canvas.addEventListener('touchend', (e) => {
      clearTimeout(holdTimer);
      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;

      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) {
        // Swipe
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) emulator.keyDown(6); // Right
          else emulator.keyDown(5); // Left
        } else {
          if (dy > 0) emulator.keyDown(7); // Down
          else emulator.keyDown(4); // Up
        }
        setTimeout(() => emulator.keyUpAll(), 120);
      } else {
        // Tap / Double Tap
        const now = Date.now();
        if (now - lastTap < 280) {
          emulator.keyDown(1); // B
          setTimeout(() => emulator.keyUp(1), 60);
        } else {
          emulator.keyDown(0); // A
          setTimeout(() => emulator.keyUp(0), 60);
        }
        lastTap = now;
      }
    });

    // Start everything
    window.onload = loadROM;
  </script>
</body>
</html>
