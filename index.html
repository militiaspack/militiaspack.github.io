<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, user-scalable=no">
  <title>Pokémon Ray-Ban</title>
  <style>
    body { margin:0; padding:0; background:#000; overflow:hidden; }
    iframe { width:100%; height:100vh; border:none; }
    #status { position:absolute; top:10px; left:10px; color:#0f0; z-index:10; font-family:monospace; background:rgba(0,0,0,0.7); padding:8px; }
  </style>
</head>
<body>
  <div id="status">Loading Pokémon...</div>
  <iframe id="emu" src="https://andychase.me/gbajs2/" allow="fullscreen"></iframe>

  <script>
    const status = document.getElementById('status');
    const iframe = document.getElementById('emu');

    // Note: Full auto-load of local pokemon.gba is hard due to iframe restrictions.
    // For best results, upload your pokemon.gba to a public URL and replace the line below.
    // Example: const romUrl = "https://your-site.com/pokemon.gba";

    window.onload = () => {
      // Try to communicate with the emulator (limited)
      iframe.onload = () => {
        status.textContent = "Emulator loaded - use Neural Band (swipe D-pad, tap A/B)";
        setTimeout(() => status.style.display = 'none', 4000);
      };
    };
  </script>
</body>
</html>
