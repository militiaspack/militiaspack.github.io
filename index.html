<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0">
    <title>Trello on Ray-Ban</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #0f0;
            font-family: system-ui, sans-serif;
            width: 600px;
            height: 600px;
            overflow: hidden;
            text-align: center;
        }
        .container { max-width: 560px; margin: 0 auto; }
        h1, h2, h3 { color: #0f0; margin: 10px 0; }
        
        button, input {
            background: #111;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 14px;
            margin: 8px 0;
            width: 90%;
            font-size: 18px;
            text-align: center;
            border-radius: 4px;
        }
        button:focus, input:focus {
            background: #0f0;
            color: #000;
            outline: 3px solid #fff;
        }
        .hidden { display: none !important; }
        .card { 
            background: #111; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #0f0; 
            text-align: left; 
        }
        .small { font-size: 14px; color: #aaa; }
        .header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Login / Setup Screen -->
        <div id="login-screen">
            <h1>Trello Glasses</h1>
            <h2>Ready to Connect</h2>
            <button onclick="saveCredentials()" style="background:#0f0;color:#000;font-weight:bold;">Connect to Trello</button>
            <p class="small">Your credentials are already saved in this app</p>
        </div>

        <!-- Main App -->
        <div id="main-screen" class="hidden">
            <div class="header">
                <h2 id="board-name">My Boards</h2>
                <button onclick="logout()" class="small" style="width:auto;padding:8px 12px;">Logout</button>
            </div>
            
            <div id="boards-list"></div>

            <!-- Cards View -->
            <div id="cards-view" class="hidden">
                <button onclick="backToBoards()" style="width:auto;">← Back</button>
                <h3 id="list-name"></h3>
                <div id="cards-list"></div>
                
                <input type="text" id="new-card-name" placeholder="New card name">
                <button onclick="addCard()">+ Add Card</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.trello.com/1';
        let apiKey = '67c9029f2d000311400426fca642acaf';
        let token = '85abf9a2430d297f0249fe39c9b199b946a6e3add6b3c1fed5718f1ceeda9e41';
        let currentBoardId = '', currentListId = '';

        function showScreen(id) {
            document.querySelectorAll('div[id$="-screen"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function saveCredentials() {
            localStorage.setItem('trelloKey', apiKey);
            localStorage.setItem('trelloToken', token);
            loadBoards();
        }

        async function fetchTrello(endpoint) {
            const url = `${API_BASE}${endpoint}?key=${apiKey}&token=${token}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('API Error');
            return res.json();
        }

        async function loadBoards() {
            showScreen('main-screen');
            try {
                const boards = await fetchTrello('/members/me/boards');
                const html = boards.map(b => `
                    <button onclick="selectBoard('${b.id}', '${b.name.replace(/'/g, "\\'")}')" style="width:90%;">
                        ${b.name}
                    </button>
                `).join('');
                document.getElementById('boards-list').innerHTML = html || '<p>No boards found</p>';
            } catch (e) {
                alert('Failed to load boards: ' + e.message);
            }
        }

        async function selectBoard(boardId, boardName) {
            currentBoardId = boardId;
            document.getElementById('board-name').textContent = boardName;
            try {
                const lists = await fetchTrello(`/boards/${boardId}/lists`);
                if (lists.length > 0) {
                    currentListId = lists[0].id;
                    document.getElementById('list-name').textContent = lists[0].name;
                    loadCards(lists[0].id);
                }
            } catch (e) { alert(e.message); }
        }

        async function loadCards(listId) {
            document.getElementById('cards-view').classList.remove('hidden');
            try {
                const cards = await fetchTrello(`/lists/${listId}/cards`);
                const html = cards.map(c => `<div class="card">${c.name}</div>`).join('');
                document.getElementById('cards-list').innerHTML = html || '<p>No cards yet</p>';
            } catch (e) { alert(e.message); }
        }

        async function addCard() {
            const name = document.getElementById('new-card-name').value.trim();
            if (!name || !currentListId) return alert('Enter a card name');
            try {
                await fetch(`${API_BASE}/cards?key=${apiKey}&token=${token}&name=${encodeURIComponent(name)}&idList=${currentListId}`, { method: 'POST' });
                document.getElementById('new-card-name').value = '';
                loadCards(currentListId);
            } catch (e) { alert('Failed to add card: ' + e.message); }
        }

        function backToBoards() {
            document.getElementById('cards-view').classList.add('hidden');
        }

        function logout() {
            if (confirm('Logout and clear credentials?')) {
                localStorage.clear();
                showScreen('login-screen');
            }
        }

        // Start the app
        window.onload = () => {
            saveCredentials();   // Auto connect using the pre-filled keys
        };
    </script>
</body>
</html>
