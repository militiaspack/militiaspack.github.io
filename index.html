<!-- EmulatorJS (NO BIOS REQUIRED) -->
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  let overlay = document.getElementById("overlay");
  const canvasWrap = document.getElementById("wrap");

  // fallback overlay
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.style.position = "absolute";
    overlay.style.top = "10px";
    overlay.style.left = "10px";
    overlay.style.color = "#00ff66";
    overlay.style.fontFamily = "monospace";
    document.body.appendChild(overlay);
  }

  overlay.textContent = "Loading Emulator...";

  // ===============================
  // EMULATOR CONFIG
  // ===============================

  window.EJS_player = "#wrap";
  window.EJS_core = "gba";
  window.EJS_gameUrl = "./pokemon.gba";
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

  // optional UI tweaks
  window.EJS_startOnLoaded = true;
  window.EJS_hideControls = true;

  // ===============================
  // INPUT BRIDGE
  // ===============================

  function press(key) {
    if (!window.EJS_emulator) return;

    const map = {
      A: "a",
      B: "b",
      START: "start",
      UP: "up",
      DOWN: "down",
      LEFT: "left",
      RIGHT: "right"
    };

    window.EJS_emulator.buttonDown(map[key]);

    setTimeout(() => {
      window.EJS_emulator.buttonUp(map[key]);
    }, 120);
  }

  // ===============================
  // META INPUT LAYER
  // ===============================

  function handleGesture(e) {
    const { type, direction } = e;

    switch (type) {
      case "tap":
        press("A");
        break;

      case "doubleTap":
        press("B");
        break;

      case "hold":
        press("START");
        break;

      case "swipe":
        if (direction === "left") press("LEFT");
        if (direction === "right") press("RIGHT");
        if (direction === "up") press("UP");
        if (direction === "down") press("DOWN");
        break;
    }
  }

  // ===============================
  // EVENT HOOKS
  // ===============================

  window.addEventListener("metaGesture", (e) => {
    handleGesture(e.detail);
  });

  window.addEventListener("keydown", (e) => {

    if (e.key === "ArrowUp") handleGesture({type:"swipe",direction:"up"});
    if (e.key === "ArrowDown") handleGesture({type:"swipe",direction:"down"});
    if (e.key === "ArrowLeft") handleGesture({type:"swipe",direction:"left"});
    if (e.key === "ArrowRight") handleGesture({type:"swipe",direction:"right"});

    if (e.key === "Enter") handleGesture({type:"tap"});
    if (e.key === " ") handleGesture({type:"doubleTap"});
    if (e.key === "Shift") handleGesture({type:"hold"});
  });

  // ===============================
  // READY STATE CHECK
  // ===============================

  const checkReady = setInterval(() => {
    if (window.EJS_emulator) {
      overlay.textContent = "READY";
      clearInterval(checkReady);
    }
  }, 500);

});
</script>
