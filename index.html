<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0">
    <title>Trello on Ray-Ban</title>
    <style>
        body {margin:0;padding:20px;background:#000;color:#0f0;font-family:system-ui,sans-serif;width:600px;height:600px;overflow:hidden;text-align:center;}
        h1,h2 {color:#0f0;}
        input,button {
            background:#111;color:#0f0;border:2px solid #0f0;
            padding:16px;margin:10px 0;width:92%;font-size:19px;
        }
        button:focus,input:focus {background:#0f0;color:#000;}
        .hidden {display:none !important;}
        .card {background:#111;padding:12px;margin:8px 0;border:1px solid #0f0;text-align:left;}
        .info {font-size:15px;color:#aaa;line-height:1.4;}
    </style>
</head>
<body>
    <div id="setup-screen">
        <h1>Trello on Ray-Ban</h1>
        <h2>Connect Your Account</h2>
        <input type="text" id="api-key" placeholder="API Key">
        <input type="text" id="token" placeholder="Token">
        <button onclick="connect()">Connect to Trello</button>
        <p class="info">
            <a href="https://trello.com/app-key" target="_blank" style="color:#0f0;">Get API Key + Token</a><br>
            Set token to Never expire
        </p>
    </div>

    <div id="main-screen" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h2 id="board-name">Boards</h2>
            <button onclick="logout()" style="width:auto;padding:8px 12px;">Logout</button>
        </div>
        <div id="boards-list"></div>

        <div id="cards-view" class="hidden">
            <button onclick="backToBoards()" style="width:auto;margin-bottom:10px;">← Back</button>
            <h3 id="list-name"></h3>
            <div id="cards-list"></div>
            <input type="text" id="new-card-name" placeholder="New card name">
            <button onclick="addCard()">+ Add Card</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.trello.com/1';
        let apiKey = '', token = '', currentBoardId = '', currentListId = '';

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return { key: params.get('key'), token: params.get('token') };
        }

        function showScreen(id) {
            document.querySelectorAll('div[id$="-screen"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function connect() {
            apiKey = document.getElementById('api-key').value.trim();
            token = document.getElementById('token').value.trim();
            if (!apiKey || !token) return alert("Enter both fields");
            localStorage.setItem('trelloKey', apiKey);
            localStorage.setItem('trelloToken', token);
            loadBoards();
        }

        async function fetchTrello(endpoint) {
            const res = await fetch(`${API_BASE}${endpoint}?key=${apiKey}&token=${token}`);
            if (!res.ok) throw new Error(`Error ${res.status}`);
            return res.json();
        }

        async function loadBoards() {
            showScreen('main-screen');
            try {
                const boards = await fetchTrello('/members/me/boards');
                const html = boards.map(b => `<button onclick="selectBoard('${b.id}','${b.name.replace(/'/g,"\\'")}')" style="width:92%;">${b.name}</button>`).join('');
                document.getElementById('boards-list').innerHTML = html || '<p>No boards</p>';
            } catch (e) { alert('Failed: ' + e.message); }
        }

        async function selectBoard(id, name) {
            currentBoardId = id;
            document.getElementById('board-name').textContent = name;
            const lists = await fetchTrello(`/boards/${id}/lists`);
            if (lists.length > 0) {
                currentListId = lists[0].id;
                document.getElementById('list-name').textContent = lists[0].name;
                loadCards(lists[0].id);
            }
        }

        async function loadCards(listId) {
            document.getElementById('cards-view').classList.remove('hidden');
            const cards = await fetchTrello(`/lists/${listId}/cards`);
            const html = cards.map(c => `<div class="card">${c.name}</div>`).join('');
            document.getElementById('cards-list').innerHTML = html || '<p>No cards</p>';
        }

        async function addCard() {
            const name = document.getElementById('new-card-name').value.trim();
            if (!name) return;
            await fetch(`${API_BASE}/cards?key=${apiKey}&token=${token}&name=${encodeURIComponent(name)}&idList=${currentListId}`, {method:'POST'});
            document.getElementById('new-card-name').value = '';
            loadCards(currentListId);
        }

        function backToBoards() { document.getElementById('cards-view').classList.add('hidden'); }

        function logout() {
            if (confirm('Logout?')) location.reload();
        }

        window.onload = () => {
            const p = getUrlParams();
            const savedKey = localStorage.getItem('trelloKey');
            const savedToken = localStorage.getItem('trelloToken');

            if (p.key && p.token) {
                apiKey = p.key; token = p.token;
                loadBoards();
            } else if (savedKey && savedToken) {
                apiKey = savedKey; token = savedToken;
                loadBoards();
            } else {
                showScreen('setup-screen');
            }
        };
    </script>
</body>
</html>
